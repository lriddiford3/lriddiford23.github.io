<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box}

/* Set height of body and the document to 100% */
body, html {
  height: 100%;
  margin: 0;
  font-family: Arial;
}

/* Style tab links */
.tablink {
  background-color: #edf6f9;
  color: black;
  float: left;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 14px 16px;
  font-size: 17px;
  width: 25%;
}

.tablink:hover {
  background-color: #d9edf3;
}

/* Style the tab content (and add height:100% for full page content) */
.tabcontent {
  color: black;
  display: none;
  padding: 100px 20px;
  height: 100%;
}

#Home {background-color: #edf6f9;}
#Publications {background-color: #edf6f9;}
#Projects {background-color: #edf6f9;}
</style>
</head>
<body>

<button class="tablink" onclick="openPage('Home', this, 'lightblue')">Home</button>
<button class="tablink" onclick="openPage('Publications', this, 'lightblue')" id="defaultOpen">Publications</button>
<button class="tablink" onclick="openPage('Projects', this, 'lightblue')">Projects</button>

<div id="Home" class="tabcontent">
  
</div>

<div id="Publications" class="tabcontent">
  <h3>Publications</h3>
  <p>Some news this fine day!</p> 
</div>

<div id="Projects" class="tabcontent">
  <h3>Projects</h3>
  <p>Get in touch, or swing by for a cup of coffee.</p>
</div>


<script>
function openPage(pageName,elmnt, color) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablink");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].style.backgroundColor = "";
  }
  document.getElementById(pageName).style.display = "block";
  elmnt.style.backgroundColor = color;
}

// Get the element with id="defaultOpen" and click on it
document.getElementById("defaultOpen").click();
</script>
   
</body>
</html>
